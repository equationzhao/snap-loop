name: SnapLoop
options:
  deploymentTarget:
    iOS: '26.0'
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.5.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SnapLoop:
    type: application
    platform: iOS
    sources:
      - SnapLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.equationzhao.SnapLoop
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: '瞬环'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets:
        - SnapLoopUITests
  SnapLoopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/SnapLoopUITests
    dependencies:
      - target: SnapLoop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.equationzhao.SnapLoop.UITests
